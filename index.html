<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Project Snake</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-wrapper">

        <!-- AREA GAME -->
        <div class="game-area">

            <canvas
                id="gameCanvas"
                width="800"
                height="600">
            </canvas>


            <!-- SKOR -->
            <div class="score-box">
                <span>🏆 SKOR</span>
                <strong id="score">0</strong>
            </div>


            <!-- GAME OVER -->
            <div id="gameOver" class="game-over hidden">

                <h1>GAME OVER</h1>

                <p>
                    Skor kamu:
                    <span id="finalScore">0</span>
                </p>

                <button
                    id="restartButton"
                    class="restart-button">
                    🔄 MAIN LAGI
                </button>

            </div>


            <!-- KONTROL HP -->
            <div class="mobile-controls">

                <button data-direction="up">▲</button>

                <div>
                    <button data-direction="left">◀</button>
                    <button data-direction="down">▼</button>
                    <button data-direction="right">▶</button>
                </div>

            </div>

        </div>


        <!-- PANEL SAMPING -->
        <div class="side-panel">

            <h1>🐍 SNAKE</h1>


            <!-- SKOR -->
            <div class="panel-card">

                <h2>🎯 SKOR</h2>

                <div class="big-score" id="sideScore">
                    0
                </div>

            </div>


            <!-- MAKANAN -->
            <div class="panel-card">

                <h2>🍎 MAKANAN</h2>

                <p>
                    Makan buah untuk mendapatkan skor!
                </p>

                <div class="fruit-list">
                    🍎 🍌 🍇 🍉 🍓
                </div>

            </div>


            <!-- KONTROL PC DAN HP -->
            <div class="panel-card">

                <h2>🎮 KONTROL</h2>

                <p>⬆️ W / ↑ = Atas</p>
                <p>⬇️ S / ↓ = Bawah</p>
                <p>⬅️ A / ← = Kiri</p>
                <p>➡️ D / → = Kanan</p>

                <p class="mobile-info">
                    📱 HP = Gunakan tombol di layar
                </p>

            </div>


            <!-- TOMBOL KELUAR -->
            <button
                class="exit-button"
                onclick="keluarGame()">
                🚪 KELUAR
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
